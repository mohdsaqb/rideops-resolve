services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rideops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideops}
      POSTGRES_DB: rideops
    volumes:
      - rideops-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U rideops -d rideops"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideops}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  rideops-data:
